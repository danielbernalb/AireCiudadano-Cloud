apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  labels:
    app: pushgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pushgateway
  template:
    metadata:
      labels:
        app: pushgateway
    spec:
      containers:
        - name: pushgateway
          image: python:3.11-slim
          command: ["/bin/bash", "-c", "/config/run.sh"]
          volumeMounts:
            - name: config-volume
              mountPath: /config
            # NUEVO MONTAJE
            - name: calibration-volume
              mountPath: /etc/sensor-calibrations
          env:
            - name: MQTT_BROKER
              value: "mqtt-np"
            - name: MQTT_PORT
              value: "1883"
            - name: MQTT_TOPIC
              value: "measurement"
            - name: EXPORTER_PORT
              value: "9091"
            - name: STALENESS_SECONDS
              value: "300"
            - name: CLEANUP_INTERVAL
              value: "60"
            - name: MQTT_KEEPALIVE
              value: "60"
            - name: MQTT_DISCONNECT_RESTART_SECONDS
              value: "180"
            # NUEVA VARIABLE PARA LA RUTA DE LA TABLA
            - name: CALIBRATION_FILE_PATH
              value: "/etc/sensor-calibrations/calibration.yaml"
          ports:
            - containerPort: 9091
              name: http-metrics
          # probes que harán que Kubernetes reinicie el pod si algo falla
          readinessProbe:
            httpGet:
              path: /metrics
              port: http-metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-metrics
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
          {{- toYaml .Values.resources.pushgatewaypython | nindent 12 }}
      volumes:
        - name: config-volume
          configMap:
            name: pushgateway
            defaultMode: 0755
        # NUEVO VOLUMEN
        - name: calibration-volume
          configMap:
            name: calibration-config

---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway-np
spec:
  type: NodePort
  selector:
    app: pushgateway
  ports:
    - port: 9091
      targetPort: http-metrics
      protocol: TCP
      nodePort: 30991

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: calibration-config
data:
  calibration.yaml: |
    # Tabla de calibración para sensores CHS
    # Formato: 
    # ID_SENSOR:
    #   a: valor_pendiente
    #   b: valor_interseccion
    CHS_21_P2_66rt34:
      a: 0.98
      b: -1.5
    CHS_EJEMPLO_02:
      a: 1.10
      b: 2.0

---
kind: ConfigMap
apiVersion: v1
metadata:
  name: pushgateway
data:
  run.sh: |
    #!/bin/bash
    set -euo pipefail
    pip install --no-cache-dir -q paho-mqtt pyyaml prometheus_client
    exec python -u /config/pushgatewaypython.py

  pushgatewaypython.py: |
    import os
    import time
    import yaml
    import json # <-- Añadido para mejor rendimiento
    import threading
    import logging
    import signal
    import sys

    from collections import defaultdict
    from prometheus_client.core import GaugeMetricFamily, CollectorRegistry
    from wsgiref.simple_server import make_server
    import paho.mqtt.client as mqtt

    # ---------- Config ----------
    MQTT_BROKER = os.environ.get("MQTT_BROKER", "localhost")
    MQTT_PORT = int(os.environ.get("MQTT_PORT", "1883"))
    MQTT_TOPIC = os.environ.get("MQTT_TOPIC", "measurement")
    EXPORTER_PORT = int(os.environ.get("EXPORTER_PORT", "9091"))
    STALENESS_SECONDS = int(os.environ.get("STALENESS_SECONDS", "300"))
    CLEANUP_INTERVAL = int(os.environ.get("CLEANUP_INTERVAL", "60"))
    MQTT_KEEPALIVE = int(os.environ.get("MQTT_KEEPALIVE", "60"))
    MQTT_DISCONNECT_RESTART_SECONDS = int(os.environ.get("MQTT_DISCONNECT_RESTART_SECONDS", "120"))
    CALIBRATION_FILE = os.environ.get("CALIBRATION_FILE_PATH", "/etc/sensor-calibrations/calibration.yaml")
    # ---------------------------

    logging.basicConfig(
        level=logging.INFO,
        format="%(asctime)s [%(levelname)s] %(message)s",
        stream=sys.stdout
    )
    log = logging.getLogger("pushgateway")

    # Diccionario global para la tabla de calibración
    chs_calibration_table = {}

    def load_calibration_table():
        """Carga o recarga el archivo YAML de calibración desde el ConfigMap"""
        global chs_calibration_table
        try:
            if os.path.exists(CALIBRATION_FILE):
                with open(CALIBRATION_FILE, 'r') as f:
                    data = yaml.safe_load(f)
                    if data:
                        chs_calibration_table = data
            else:
                log.warning("Archivo de calibración no encontrado en %s", CALIBRATION_FILE)
        except Exception as e:
            log.error("Error recargando tabla de calibración: %s", e)

    FIELD_MAP = {
        'PM25': 'PM25', 'PM25raw': 'PM25raw', 'PM251': 'PM251', 'PM252': 'PM252',
        'PM1': 'PM1', 'VOC': 'VOC', 'NOx': 'NOx', 'humidity': 'Humidity',
        'temperature': 'Temperature', 'RSSI': 'RSSI', 'latitude': 'Latitude',
        'longitude': 'Longitude', 'inout': 'InOut', 'configval': 'ConfigVal',
        'datavar1': 'Var1', 'datavar2': 'Var2', 'noisepeak': 'NoisePeak', 'noisedba': 'Noise',
    }

    METRICS_AS_INTEGER = {
        'PM25', 'PM25raw', 'PM251', 'PM252', 'PM1', 'VOC', 'NOx', 'Humidity',
        'Temperature', 'RSSI', 'InOut', 'ConfigVal', 'Var1', 'Var2', 'NoisePeak', 'Noise'
    }

    metrics_data = defaultdict(dict)
    metrics_lock = threading.Lock()
    last_seen = {}
    last_seen_lock = threading.Lock()

    internal_stats = {'messages_total': 0, 'messages_errors': 0}
    stop_event = threading.Event()
    mqtt_client = None

    def map_field_name(key):
        return FIELD_MAP.get(key, key)

    def to_number_preserve_type(val):
        if isinstance(val, bool): return int(val)
        if isinstance(val, (int, float)): return val
        if isinstance(val, str):
            try:
                return float(val) if '.' in val or 'e' in val.lower() else int(val)
            except (ValueError, TypeError):
                return 0
        try:
            return float(val)
        except (ValueError, TypeError):
            return 0

    def update_metrics_from_payload(device_id, payload):
        now = time.time()
        with last_seen_lock:
            last_seen[device_id] = now
        with metrics_lock:
            for k, v in payload.items():
                if k == 'id': continue
                metric_name = map_field_name(k)
                num = to_number_preserve_type(v)

                # LÓGICA DE CALIBRACIÓN EXTERNA
                if metric_name == 'PM25' and device_id.startswith('CHS'):
                    cal_data = chs_calibration_table.get(device_id, {})
                    slope = cal_data.get('a', 1.0)
                    intercept = cal_data.get('b', 0.0)
                    
                    try:
                        corrected_val = (float(num) * slope) + intercept
                        num = int(round(corrected_val))
                    except Exception as e:
                        log.error("Error calculando regresión para %s: %s", device_id, e)

                metrics_data[metric_name][device_id] = num

    def remove_job_from_metrics(job):
        with metrics_lock:
            for metric in list(metrics_data.keys()):
                if job in metrics_data[metric]:
                    del metrics_data[metric][job]
                if not metrics_data[metric]:
                    del metrics_data[metric]

    class OrderedMetricsCollector(object):
        def collect(self):
            mt = GaugeMetricFamily('pushgateway_messages_total', 'Total MQTT messages received (pushgateway)')
            mt.add_metric([], float(internal_stats['messages_total']))
            yield mt
            me = GaugeMetricFamily('pushgateway_messages_errors_total', 'Total processing errors')
            me.add_metric([], float(internal_stats['messages_errors']))
            yield me

            with metrics_lock:
                metric_items = {k: dict(v) for k, v in metrics_data.items()}
            for metric_name in sorted(metric_items.keys(), key=lambda s: s.lower()):
                job_values = metric_items[metric_name]
                g = GaugeMetricFamily(metric_name, f'Auto-created metric {metric_name}', labels=['instance','job'])
                for job in sorted(job_values.keys(), key=lambda s: s.lower()):
                    value = job_values[job]
                    try:
                        g.add_metric(["", job], float(value))
                    except (ValueError, TypeError):
                        g.add_metric(["", job], 0.0)
                yield g

    def on_connect(client, userdata, flags, rc, properties=None):
        if rc == 0:
            log.info("Connected to MQTT broker; subscribing to %s", MQTT_TOPIC)
            client.subscribe([(MQTT_TOPIC, 0)])
        else:
            log.warning("MQTT on_connect returned rc=%s", rc)

    def on_message(client, userdata, msg):
        try:
            raw = msg.payload.decode('utf-8')
            # Mejora 2: Intento primario con JSON (10x más rápido), fallback a YAML
            try:
                payload = json.loads(raw)
            except json.JSONDecodeError:
                payload = yaml.safe_load(raw)
                
            if not isinstance(payload, dict):
                return
            device_id = payload.get('id') or payload.get('ID') or payload.get('device')
            if not device_id:
                return
            update_metrics_from_payload(device_id, payload)
            internal_stats['messages_total'] += 1
        except Exception as e:
            internal_stats['messages_errors'] += 1
            log.exception("Error processing message: %s", e)

    def on_disconnect(client, userdata, rc):
        log.warning("MQTT disconnected with rc=%s", rc)

    def cleanup_loop():
        while not stop_event.is_set():
            time.sleep(CLEANUP_INTERVAL)
            # Recarga automática de la tabla de calibración en cada ciclo
            load_calibration_table()
            try:
                now = time.time()
                to_remove = []
                with last_seen_lock:
                    for job, ts in list(last_seen.items()):
                        if (now - ts) > STALENESS_SECONDS:
                            to_remove.append(job)
                if to_remove:
                    for job in to_remove:
                        log.info("Removing stale job: %s", job)
                        remove_job_from_metrics(job)
                        with last_seen_lock:
                            if job in last_seen:
                                del last_seen[job]
            except Exception:
                log.exception("Error in cleanup loop")

    def generate_custom_metrics(registry):
        output = []
        for metric in registry.collect():
            output.append('# HELP ' + metric.name + ' ' + getattr(metric, 'documentation', ''))
            metric_type = getattr(metric, 'type', 'gauge')
            output.append('# TYPE ' + metric.name + ' ' + metric_type)
            for sample in metric.samples:
                label_parts = []
                for k, v in sorted(sample.labels.items()):
                    label_parts.append(k + '="' + str(v) + '"')
                labels = '{' + ','.join(label_parts) + '}' if label_parts else ''
                value = sample.value
                formatted_value = ""
                try:
                    if sample.name in METRICS_AS_INTEGER and float(value) == int(float(value)):
                        formatted_value = str(int(float(value)))
                    else:
                        formatted_value = str(value)
                except (ValueError, TypeError):
                    formatted_value = str(value)
                output.append(sample.name + labels + ' ' + formatted_value)
        return '\n'.join(output).encode('utf-8')

    def start_metrics_http_server(port, registry):
        def app(environ, start_response):
            path = environ.get('PATH_INFO', '') or '/'
            allowed = ('/metrics', '/metrics/', '/api/v1/metrics', '/api/v1/metrics/')
            if path in allowed:
                data = generate_custom_metrics(registry)
                status = '200 OK'
                headers = [
                    ('Content-Type', 'text/plain; version=0.0.4; charset=utf-8'),
                    ('Content-Length', str(len(data)))
                ]
                start_response(status, headers)
                return [data]
            if path == '/healthz':
                ok = False
                try:
                    if mqtt_client is not None and mqtt_client.is_connected():
                        ok = True
                    else:
                        with last_seen_lock:
                            if last_seen:
                                most_recent = max(last_seen.values())
                                if time.time() - most_recent < max(60, STALENESS_SECONDS):
                                    ok = True
                except Exception:
                    ok = False
                if ok:
                    start_response('200 OK', [('Content-Type', 'text/plain')])
                    return [b'OK']
                else:
                    start_response('503 Service Unavailable', [('Content-Type', 'text/plain')])
                    return [b'UNHEALTHY']
            if path == '/':
                start_response('302 Found', [('Location', '/api/v1/metrics')])
                return [b'']
            start_response('404 Not Found', [('Content-Type', 'text/plain')])
            return [b'Not Found']

        httpd = make_server('', port, app)
        log.info("Metrics HTTP server started on 0.0.0.0:%s", port)
        httpd.serve_forever()

    def signal_handler(signum, frame):
        log.info("Signal %s received, shutting down...", signum)
        stop_event.set()
        try:
            if mqtt_client:
                mqtt_client.disconnect()
        except Exception:
            pass
        time.sleep(1)
        sys.exit(0)

    def mqtt_watchdog_loop():
        while not stop_event.is_set():
            time.sleep(5)
            try:
                if mqtt_client is None:
                    continue
                if not mqtt_client.is_connected():
                    with last_seen_lock:
                        if not last_seen:
                            disconnected_duration = None
                        else:
                            most_recent = max(last_seen.values())
                            disconnected_duration = time.time() - most_recent
                    
                    # Mejora 1: Reemplazar sys.exit(1) con os._exit(1) para matar el proceso completo
                    if disconnected_duration is None:
                        log.warning("MQTT client not connected and no messages seen yet. Forcing restart.")
                        os._exit(1)
                    else:
                        if disconnected_duration > MQTT_DISCONNECT_RESTART_SECONDS:
                            log.warning("No messages received for %s seconds. Forcing restart.", int(disconnected_duration))
                            os._exit(1)
            except Exception:
                log.exception("Error in mqtt_watchdog_loop")

    def main():
        global mqtt_client
        
        # Cargar tabla de calibración inicial
        load_calibration_table()
        
        registry = CollectorRegistry()
        registry.register(OrderedMetricsCollector())

        http_thread = threading.Thread(target=start_metrics_http_server, args=(EXPORTER_PORT, registry), daemon=True)
        http_thread.start()

        t_cleanup = threading.Thread(target=cleanup_loop, daemon=True)
        t_cleanup.start()

        t_watchdog = threading.Thread(target=mqtt_watchdog_loop, daemon=True)
        t_watchdog.start()

        client = mqtt.Client()
        mqtt_client = client
        client.on_connect = on_connect
        client.on_message = on_message
        client.on_disconnect = on_disconnect

        signal.signal(signal.SIGTERM, signal_handler)
        signal.signal(signal.SIGINT, signal_handler)

        try:
            client.connect(MQTT_BROKER, MQTT_PORT, MQTT_KEEPALIVE)
        except Exception as e:
            log.exception("Error connecting to MQTT broker: %s", e)
            raise

        log.info("Listening to MQTT broker %s:%s topic '%s'", MQTT_BROKER, MQTT_PORT, MQTT_TOPIC)
        client.loop_start()

        try:
            while not stop_event.is_set():
                time.sleep(1)
        finally:
            log.info("Main exiting")
            try:
                client.loop_stop()
                client.disconnect()
            except Exception:
                pass

    if __name__ == '__main__':
        main()