apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqttforward
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mqttforward
  template:
    metadata:
      labels:
        app: mqttforward
    spec:
      containers:
        - name: mqttforward
          image: python
          command: ["/bin/bash"]
          args: ["-c","/config/run.sh"]
          volumeMounts:
            - name: mqttforward
              mountPath: /config/
          resources:
            requests:
              memory: "150Mi"
              cpu: "150m"
            limits:
              memory: "200Mi"
              cpu: "200m"
      volumes:
        - name: mqttforward
          configMap:
            name: mqttforward
            defaultMode: 0777

---
kind: ConfigMap
apiVersion: v1
metadata:
  name: mqttforward
data:
  run.sh: |
    #!/bin/bash
    set -euo pipefail
    # instalar deps solo una vez al arranque (mejor: crear imagen con deps)
    pip install -q paho-mqtt requests pyyaml
    # -u para evitar buffering de stdout en contenedor
    exec python -u /config/pushgateway_forwarder.py pushgateway-np mqtt-np

  pushgateway_forwarder.py: |
    #!/usr/bin/env python3
    import sys
    import threading
    import time
    import queue
    import logging
    import os
    from concurrent.futures import ThreadPoolExecutor
    import requests
    import yaml
    from paho.mqtt import client as mqtt

    LOG_LEVEL = os.environ.get("LOG_LEVEL", "INFO").upper()
    logging.basicConfig(
        level=LOG_LEVEL,
        format='%(asctime)s %(levelname)s %(threadName)s %(message)s'
    )
    logger = logging.getLogger("mqttforwarder")

    # Stats (thread-safe)
    class Stats:
        def __init__(self):
            self.lock = threading.Lock()
            self.received = 0
            self.queued = 0
            self.pushed = 0
            self.push_failed = 0
            self.malformed = 0
            self.dropped = 0

        def snapshot(self):
            with self.lock:
                return {
                    "received": self.received,
                    "queued": self.queued,
                    "pushed": self.pushed,
                    "push_failed": self.push_failed,
                    "malformed": self.malformed,
                    "dropped": self.dropped
                }

    stats = Stats()

    # Queue for messages to be pushed to Pushgateway
    MSG_QUEUE_MAXSIZE = int(os.environ.get("MSG_QUEUE_MAXSIZE", "20000"))
    msg_queue = queue.Queue(maxsize=MSG_QUEUE_MAXSIZE)

    # Worker configuration
    NUM_WORKERS = int(os.environ.get("NUM_PUSH_WORKERS", "5"))
    REQUEST_TIMEOUT = float(os.environ.get("REQUEST_TIMEOUT", "5.0"))
    MAX_RETRIES = int(os.environ.get("MAX_PUSH_RETRIES", "3"))

    def build_metrics_message(payload):
        # safe extractions with defaults
        def p(k, default=0):
            return payload.pop(k, default)
        lines = [
            f"PM25 {p('PM25',0)}",
            f"CO2 {p('CO2',0)}",
            f"VOC {p('VOC',0)}",
            f"NOx {p('NOx',0)}",
            f"Humidity {p('humidity',0)}",
            f"Temperature {p('temperature',0)}",
            f"Noise {p('noisedba',0)}",
            f"RSSI {p('RSSI',0)}",
            f"Latitude {p('latitude',0)}",
            f"Longitude {p('longitude',0)}",
            f"InOut {p('inout',0)}",
            f"ConfigVal {p('configval',0)}",
            f"PM25raw {p('PM25raw',0)}",
            f"NoisePeak {p('noisepeak',0)}",
            f"PM251 {p('PM251',0)}",
            f"PM252 {p('PM252',0)}",
            f"PM1 {p('PM1',0)}",
            f"MAC {p('mac',0)}",
            f"Var1 {p('datavar1',0)}",
            f"Var2 {p('datavar2',0)}"
        ]
        return "\n".join(lines) + "\n"

    def push_worker(pushgateway_host):
        session = requests.Session()
        headers = {'X-Requested-With': 'Python requests', 'Content-type': 'text/xml'}
        while True:
            device_id, metrics_msg, url = msg_queue.get()
            try:
                # Retries with simple exponential backoff
                success = False
                for attempt in range(1, MAX_RETRIES+1):
                    try:
                        resp = session.post(url=url, data=metrics_msg, headers=headers, timeout=REQUEST_TIMEOUT)
                        logger.debug(f"Pushgateway attempt {attempt} for {device_id}: {resp.status_code}")
                        if 200 <= resp.status_code < 300:
                            success = True
                            with stats.lock:
                                stats.pushed += 1
                            break
                        else:
                            logger.warning(f"Non-2xx from pushgateway for {device_id}: {resp.status_code} - {resp.content[:200]!r}")
                    except requests.exceptions.RequestException as e:
                        logger.warning(f"RequestException on attempt {attempt} for {device_id}: {e}")
                    # backoff
                    time.sleep(0.5 * (2 ** (attempt-1)))
                if not success:
                    with stats.lock:
                        stats.push_failed += 1
                    logger.error(f"Failed to push metrics for {device_id} after {MAX_RETRIES} attempts. Dropping.")
            except Exception as e:
                logger.exception(f"Unexpected error in push_worker for {device_id}: {e}")
            finally:
                msg_queue.task_done()

    # MQTT callbacks
    def on_connect(client, userdata, flags, rc, properties=None):
        logger.info(f"Connected to MQTT Broker with result code {rc}")
        # Subscribe with QoS 1 to reduce possible loss (publishers must support it)
        client.subscribe("measurement", qos=1)

    def on_message(client, userdata, msg):
        try:
            raw_payload = msg.payload.decode("utf-8", errors="replace")
            with stats.lock:
                stats.received += 1
            # Rate-limit raw payload logging: only debug level
            logger.debug(f"Raw payload from topic {msg.topic}: {raw_payload[:1000]}")
            try:
                payload = yaml.safe_load(raw_payload)
            except yaml.YAMLError as e:
                with stats.lock:
                    stats.malformed += 1
                logger.warning(f"Could not parse YAML: {e}; payload: {raw_payload[:200]}")
                return

            device_id = payload.pop('id', None)
            if not device_id:
                with stats.lock:
                    stats.malformed += 1
                logger.warning("Malformed message - 'id' missing. Payload keys: %s", list(payload.keys()))
                return

            metrics_msg = build_metrics_message(payload)
            url = f'http://{sys.argv[1]}:9091/metrics/job/{device_id}'

            # Encolar sin bloquear. Si la cola está llena, contar y descartar (evitar bloquear el callback)
            try:
                msg_queue.put_nowait((device_id, metrics_msg, url))
                with stats.lock:
                    stats.queued += 1
            except queue.Full:
                with stats.lock:
                    stats.dropped += 1
                logger.error("MSG_QUEUE FULL: dropping message from %s", device_id)
        except Exception as e:
            logger.exception("Unexpected error in on_message: %s", e)

    def stats_printer():
        while True:
            time.sleep(60)
            snap = stats.snapshot()
            # también podemos exponer esto por HTTP /metrics si quieres
            logger.info("STATS: received=%d queued=%d pushed=%d push_failed=%d malformed=%d dropped=%d queue_size=%d",
                        snap["received"], snap["queued"], snap["pushed"], snap["push_failed"],
                        snap["malformed"], snap["dropped"], msg_queue.qsize())

    def main():
        if len(sys.argv) != 3:
            print('Usage: '+sys.argv[0]+' <pushgateway host> <mqttbroker host>. Found '+str(len(sys.argv))+' arguments.')
            sys.exit(1)

        pushgateway_host = sys.argv[1]
        mqtt_host = sys.argv[2]

        # Start push workers
        for i in range(NUM_WORKERS):
            t = threading.Thread(target=push_worker, args=(pushgateway_host,), daemon=True, name=f"push-worker-{i+1}")
            t.start()

        # Stats thread
        t_stats = threading.Thread(target=stats_printer, daemon=True, name="stats-printer")
        t_stats.start()

        client = mqtt.Client()  # usa defaults MQTTv3.1.1 (si necesitas v5 ajusta aquí)
        client.on_connect = on_connect
        client.on_message = on_message

        # Tweaks to reduce loss & improve reconnect behavior
        try:
            client.reconnect_delay_set(min_delay=1, max_delay=120)
            try:
                client.max_inflight_messages_set(1000)
            except Exception:
                logger.debug("max_inflight_messages_set not supported in this paho version")
            try:
                client.max_queued_messages_set(0)  # no cola de salida (no estamos publicando por paho)
            except Exception:
                logger.debug("max_queued_messages_set not supported in this paho version")
        except Exception:
            logger.exception("Error setting client options")

        try:
            client.connect(mqtt_host, 1883, keepalive=60)
            client.loop_start()
            # Mantener proceso vivo
            while True:
                time.sleep(1)
        except KeyboardInterrupt:
            logger.info("Interrupted, stopping")
        except Exception as e:
            logger.exception(f"ERROR connecting to MQTT: {e}")

    if __name__ == "__main__":
        main()