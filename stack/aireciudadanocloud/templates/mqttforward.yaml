apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqttforward
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mqttforward
  template:
    metadata:
      labels:
        app: mqttforward
    spec:
      containers:
        - name: mqttforward
          # mejor usar una imagen basada en python slim; luego crea una imagen personalizada
          image: python:3.11-slim
          command: ["/bin/bash"]
          args: ["-c","/config/run.sh"]
          env:
            - name: LOG_LEVEL
              value: "INFO"
            - name: REQUEST_TIMEOUT
              value: "10.0"
            - name: MAX_PUSH_RETRIES
              value: "5"
            - name: NUM_PUSH_WORKERS
              value: "8"
            - name: MSG_QUEUE_MAXSIZE
              value: "50000"
            - name: BATCH_MAX
              value: "200"
            - name: BATCH_TIMEOUT
              value: "1.0"
          volumeMounts:
            - name: mqttforward
              mountPath: /config/
          resources:
            requests:
              memory: "300Mi"
              cpu: "300m"
            limits:
              memory: "600Mi"
              cpu: "600m"
      volumes:
        - name: mqttforward
          configMap:
            name: mqttforward
            defaultMode: 0777

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mqttforward
data:
  run.sh: |
    #!/bin/bash
    set -euo pipefail
    # instalar deps (mejor: crear imagen con deps preinstaladas)
    pip install -q paho-mqtt requests pyyaml
    # ejecutar el script con -u para que no haya buffering
    exec python -u /config/pushgateway_forwarder.py pushgateway-np mqtt-np

  pushgateway_forwarder.py: |
    #!/usr/bin/env python3
    import sys
    import os
    import time
    import yaml
    import queue
    import threading
    import logging
    import requests

    # Config desde ENV
    LOG_LEVEL = os.getenv("LOG_LEVEL", "INFO").upper()
    REQUEST_TIMEOUT = float(os.getenv("REQUEST_TIMEOUT", "10.0"))
    MAX_PUSH_RETRIES = int(os.getenv("MAX_PUSH_RETRIES", "5"))
    NUM_PUSH_WORKERS = int(os.getenv("NUM_PUSH_WORKERS", "8"))
    MSG_QUEUE_MAXSIZE = int(os.getenv("MSG_QUEUE_MAXSIZE", "50000"))
    BATCH_MAX = int(os.getenv("BATCH_MAX", "200"))
    BATCH_TIMEOUT = float(os.getenv("BATCH_TIMEOUT", "1.0"))

    logging.basicConfig(level=LOG_LEVEL, format="%(asctime)s %(levelname)s %(threadName)s %(message)s")
    logger = logging.getLogger("mqttforwarder")

    # Colas:
    msg_queue = queue.Queue(maxsize=MSG_QUEUE_MAXSIZE)   # items: (device_id, payload_dict)
    batch_queue = queue.Queue(maxsize=NUM_PUSH_WORKERS * 4)  # items: batch_payload_string

    class Stats:
        def __init__(self):
            self.lock = threading.Lock()
            self.received = 0
            self.queued = 0
            self.pushed = 0
            self.push_failed = 0
            self.malformed = 0
            self.dropped = 0
        def snapshot(self):
            with self.lock:
                return {
                    "received": self.received,
                    "queued": self.queued,
                    "pushed": self.pushed,
                    "push_failed": self.push_failed,
                    "malformed": self.malformed,
                    "dropped": self.dropped
                }

    stats = Stats()

    # Construir lineas en formato Prometheus con label device="ID"
    def build_metrics_lines(device_id, payload):
        def val(k):
            v = payload.get(k)
            # asegúrate de devolver 0 o valor numérico
            try:
                return float(v) if v is not None else 0.0
            except Exception:
                try:
                    return float(str(v))
                except Exception:
                    return 0.0
        lines = []
        # ejemplo de métricas (ajusta nombres si quieres)
        lines.append(f'PM25{{device="{device_id}"}} {val("PM25")}')
        lines.append(f'CO2{{device="{device_id}"}} {val("CO2")}')
        lines.append(f'VOC{{device="{device_id}"}} {val("VOC")}')
        lines.append(f'NOx{{device="{device_id}"}} {val("NOx")}')
        lines.append(f'Humidity{{device="{device_id}"}} {val("humidity")}')
        lines.append(f'Temperature{{device="{device_id}"}} {val("temperature")}')
        lines.append(f'Noise{{device="{device_id}"}} {val("noisedba")}')
        lines.append(f'RSSI{{device="{device_id}"}} {val("RSSI")}')
        lines.append(f'Latitude{{device="{device_id}"}} {val("latitude")}')
        lines.append(f'Longitude{{device="{device_id}"}} {val("longitude")}')
        lines.append(f'InOut{{device="{device_id}"}} {val("inout")}')
        lines.append(f'ConfigVal{{device="{device_id}"}} {val("configval")}')
        lines.append(f'PM25raw{{device="{device_id}"}} {val("PM25raw")}')
        lines.append(f'NoisePeak{{device="{device_id}"}} {val("noisepeak")}')
        lines.append(f'PM251{{device="{device_id}"}} {val("PM251")}')
        lines.append(f'PM252{{device="{device_id}"}} {val("PM252")}')
        lines.append(f'PM1{{device="{device_id}"}} {val("PM1")}')
        # Puedes añadir MAC y vars como labels o saltarlas si no son numéricas
        return "\n".join(lines)

    # Batcher: consume msg_queue y produce batches en batch_queue
    def batcher_thread():
        while True:
            batch_lines = []
            batch_count = 0
            start = time.time()
            while batch_count < BATCH_MAX and (time.time() - start) < BATCH_TIMEOUT:
                try:
                    device_id, payload = msg_queue.get(timeout=max(0.01, BATCH_TIMEOUT - (time.time() - start)))
                    lines = build_metrics_lines(device_id, payload)
                    batch_lines.append(lines)
                    batch_count += 1
                    msg_queue.task_done()
                except queue.Empty:
                    break
                except Exception as e:
                    logger.exception("Error processing message in batcher: %s", e)
            if batch_lines:
                # separamos batches por doble newline para que Prometheus parsee correctamente
                payload = "\n\n".join(batch_lines) + "\n"
                try:
                    batch_queue.put_nowait(payload)
                except queue.Full:
                    # si batch_queue está full, contabilizamos dropped
                    with stats.lock:
                        stats.dropped += len(batch_lines)
                    logger.error("batch_queue full: dropping batch of %d", len(batch_lines))
            # inmediatamente continuar para armar siguiente batch

    # Push worker: consume batches y los envía al pushgateway en un único POST
    def push_worker(pushgateway_host):
        session = requests.Session()
        headers = {'X-Requested-With': 'Python requests', 'Content-type': 'text/plain; version=0.0.4'}
        url = f'http://{pushgateway_host}:9091/metrics/job/batch'
        while True:
            try:
                payload = batch_queue.get()
                success = False
                for attempt in range(1, MAX_PUSH_RETRIES + 1):
                    try:
                        resp = session.post(url=url, data=payload, headers=headers, timeout=REQUEST_TIMEOUT)
                        logger.debug("push status %s", resp.status_code)
                        if 200 <= resp.status_code < 300:
                            success = True
                            with stats.lock:
                                stats.pushed += 1
                            break
                        else:
                            logger.warning("Non-2xx from pushgateway: %s - %s", resp.status_code, resp.content[:200])
                    except requests.exceptions.RequestException as e:
                        logger.warning("RequestException on attempt %d: %s", attempt, e)
                    # backoff
                    time.sleep(0.5 * (2 ** (attempt - 1)))
                if not success:
                    with stats.lock:
                        stats.push_failed += 1
                    logger.error("Failed to push batch after %d attempts. Dropping.", MAX_PUSH_RETRIES)
            except Exception as e:
                logger.exception("Unexpected error in push_worker: %s", e)
            finally:
                try:
                    batch_queue.task_done()
                except Exception:
                    pass

    # Stats printer
    def stats_printer():
        while True:
            time.sleep(60)
            snap = stats.snapshot()
            logger.info("STATS: received=%d queued=%d pushed=%d push_failed=%d malformed=%d dropped=%d queue_size=%d",
                        snap["received"], snap["queued"], snap["pushed"], snap["push_failed"],
                        snap["malformed"], snap["dropped"], msg_queue.qsize())

    # MQTT callbacks
    try:
        from paho.mqtt import client as mqtt
    except Exception as e:
        logger.exception("Missing paho-mqtt lib: %s", e)
        raise

    def on_connect(client, userdata, flags, rc):
        logger.info("Connected to MQTT Broker with result code %s", rc)
        client.subscribe("measurement", qos=1)

    def on_message(client, userdata, msg):
        try:
            raw = msg.payload.decode("utf-8", errors="replace")
            with stats.lock:
                stats.received += 1
            logger.debug("raw payload: %s", raw[:1000])
            try:
                payload = yaml.safe_load(raw)
            except yaml.YAMLError as e:
                with stats.lock:
                    stats.malformed += 1
                logger.warning("YAML parse error: %s", e)
                return
            device_id = payload.pop("id", None)
            if not device_id:
                with stats.lock:
                    stats.malformed += 1
                logger.warning("Missing id in payload keys: %s", list(payload.keys()))
                return
            # Encolar payload en msg_queue sin bloquear
            try:
                msg_queue.put_nowait((device_id, payload))
                with stats.lock:
                    stats.queued += 1
            except queue.Full:
                with stats.lock:
                    stats.dropped += 1
                logger.error("msg_queue FULL: dropping message from %s", device_id)
        except Exception as e:
            logger.exception("Unexpected error in on_message: %s", e)

    def main():
        if len(sys.argv) != 3:
            print("Usage: {} <pushgateway host> <mqtt host>".format(sys.argv[0]))
            sys.exit(1)
        pushgateway_host = sys.argv[1]
        mqtt_host = sys.argv[2]

        # Iniciar batcher
        t = threading.Thread(target=batcher_thread, name="batcher", daemon=True)
        t.start()

        # Iniciar push workers
        for i in range(NUM_PUSH_WORKERS):
            t = threading.Thread(target=push_worker, args=(pushgateway_host,), name=f"push-worker-{i+1}", daemon=True)
            t.start()

        # Stats thread
        t_stats = threading.Thread(target=stats_printer, name="stats-printer", daemon=True)
        t_stats.start()

        # MQTT client
        client = mqtt.Client()
        client.on_connect = on_connect
        client.on_message = on_message

        try:
            client.reconnect_delay_set(min_delay=1, max_delay=120)
            try:
                client.max_inflight_messages_set(1000)
            except Exception:
                logger.debug("max_inflight not supported")
            client.connect(mqtt_host, 1883, keepalive=60)
            client.loop_start()
            while True:
                time.sleep(1)
        except KeyboardInterrupt:
            logger.info("Interrupted")
        except Exception as e:
            logger.exception("MQTT connect/loop error: %s", e)

    if __name__ == "__main__":
        main()
