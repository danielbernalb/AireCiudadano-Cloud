    # TABLA DE CALIBRACIÓN PM25 — SENSORES CHS
    # =====================================================
    # Fórmula aplicada: ValorNuevo = round(ValorViejo * a + b)
    #
    # Reglas:
    #   - Solo se calibran sensores cuyo nombre empiece por "CHS"
    #   - Si un sensor CHS no aparece aquí, se usa a=1.0 y b=0.0
    #     (sin corrección) y se emite un warning en los logs
    #
    # Para aplicar cambios SIN reiniciar el pod:
    #   kubectl apply -f calibration-configmap.yaml
    #   (el pod recarga el archivo automáticamente cada CLEANUP_INTERVAL segundos)
    #
    # Para aplicar cambios inmediatamente:
    #   kubectl rollout restart deployment/pushgateway
    # =====================================================

